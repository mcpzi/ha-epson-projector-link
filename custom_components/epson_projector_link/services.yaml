load_lens_memory:
  name: Load Lens Memory
  description: Load a previously saved lens memory on the Epson projector
  target:
    entity:
      integration: epson_projector_link
      domain: media_player
  fields:
    lens_memory_id:
      name: Lens Memory ID
      description: Lens Memory ID
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 10

load_picture_memory:
  name: Load Picture Memory
  description: Load a previously saved picture memory on the Epson projector
  target:
    entity:
      integration: epson_projector_link
      domain: media_player
  fields:
    picture_memory_id:
      name: Picture Memory ID
      description: Picture Memory ID
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 10

push_picture_memory:
  name: Push Picture Memory
  description: Save the projector's current picture settings (color mode, HDR/dynamic range, and similar) to a picture memory slot, overwriting it
  target:
    entity:
      integration: epson_projector_link
      domain: media_player
  fields:
    picture_memory_id:
      name: Picture Memory ID
      description: Picture Memory ID
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 10

erase_picture_memory:
  name: Erase Picture Memory
  description: Delete a saved picture memory on the Epson projector
  target:
    entity:
      integration: epson_projector_link
      domain: media_player
  fields:
    picture_memory_id:
      name: Picture Memory ID
      description: Picture Memory ID
      required: true
      example: 1
      selector:
        number:
          min: 1
          max: 10

send_command:
  name: Send Command
  description: Send ESC/VP21 Command
  target:
    entity:
      integration: epson_projector_link
      domain: media_player
  fields:
    command:
      name: Command
      description: ESC/VP21 Command
      required: true
      example: PWR ON
      selector:
        text:
